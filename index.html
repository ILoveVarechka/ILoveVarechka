<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Я люблю тибяяя, бяя❤️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<canvas id="bg"></canvas>

<main>
  <section class="hero">
    <h1>Варечка мояя</h1>
    <p class="subtitle">Мы вместе ужее:</p>

    <div class="counter">
      <div class="unit"><span id="days">0</span><small>денёчков</small></div>
      <div class="unit"><span id="hours">0</span><small>часочков</small></div>
      <div class="unit"><span id="mins">0</span><small>минуток</small></div>
      <div class="unit"><span id="secs">0</span><small>секундочекк</small></div>
    </div>

    <p class="typewriter" id="typewriter"></p>

    <a href="love.html" class="love-btn">Нажми, если любишь меня!</a>
  </section>

  <section class="game">
    <h2>Поймай сердечкиии</h2>
    <p>Успей поймать <b>10</b> сердечек за <b>20</b> секундочек</p>

    <div class="game-area" id="gameArea">
      <div class="game-hud">
        <span>Пойманаа: <b id="score">0</b></span>
        <span>Время: <b id="timer">20</b></span>
      </div>
      <button id="startGame">Начаааать!!</button>
    </div>

    <p id="gameResult"></p>
  </section>
</main>

<script src="script.js?v=5"></script>
</body>
</html>
